name: Validate Noticeboard Creator

on:
  pull_request:
  push:
    branches: [main]

jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check paper-textures.js
          node --check tests/parchment.test.cjs
      - name: Run regression tests
        run: node --test tests/*.test.cjs
